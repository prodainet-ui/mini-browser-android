name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore: ['desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Подготовка файла
        run: cp app/build/outputs/apk/release/app-release.apk MiniBrowser.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Мой браузер 1.0.${{ github.run_number }}
          body: |
            Скачайте **MiniBrowser.apk** на телефон и откройте файл, чтобы установить.
            Новая версия ставится поверх старой — вкладки и закладки сохранятся.
          files: MiniBrowser.apk
          make_latest: true
